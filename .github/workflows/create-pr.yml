name: Create Pull Request

on:
  push:
    branches-ignore:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$(gh pr list \
            --head "$BRANCH" \
            --base develop \
            --state open \
            --json number \
            --jq 'length')" -gt 0 ]; then
            echo "Pull Request already exists."
            exit 0
          fi

          gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "Merge $BRANCH into develop" \
            --body "Automatically created Pull Request."
